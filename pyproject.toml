[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "saptest"
version = "0.1.0"
description = "SAP S/4HANA role-aware UAT automation library and runner"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "openpyxl>=3.1",
    "Pillow>=10.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "typer>=0.12",
]

[project.optional-dependencies]
# Windows-only runtime. The library imports and its tests run without these;
# only the guiscript and legacy_ui drivers need them.
windows = [
    "pywin32>=306; sys_platform == 'win32'",
    "pywinauto>=0.6.8; sys_platform == 'win32'",
    "pyautogui>=0.9.54; sys_platform == 'win32'",
    "pygetwindow>=0.0.9; sys_platform == 'win32'",
    "pyperclip>=1.8; sys_platform == 'win32'",
]
dev = ["pytest>=8.0", "pytest-cov>=4.1", "ruff>=0.3"]
build = ["pyinstaller>=6.4"]

[project.scripts]
saptest = "saptest.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
saptest = ["ui/templates/*.html", "ui/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# typer's whole API is function calls in argument defaults.
"src/saptest/cli.py" = ["B008"]
# setup_case/teardown_case are optional hooks a flow may override, deliberately
# concrete no-ops rather than abstract methods every flow must implement.
"src/saptest/flows/base.py" = ["B027"]
